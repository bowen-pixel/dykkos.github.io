<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Rings and ideals</title>
  <desc id="desc">The ring of integers Z contains the ideals 2Z and 3Z. Their intersection is 6Z. Examples 2 and 4 lie only in 2Z, 3 and 9 only in 3Z, and 6 and 12 in both.</desc>
  <rect width="640" height="360" fill="white"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#111" text-anchor="middle">
    <text x="320" y="37" font-size="28">Rings &amp; ideals</text>
    <ellipse cx="320" cy="184" rx="291" ry="126" fill="none" stroke="#333" stroke-width="2"/>
    <text x="72" y="123" font-size="27">ℤ</text>
    <ellipse cx="252" cy="185" rx="122" ry="88" fill="#e8eef8" fill-opacity=".65" stroke="#304974" stroke-width="2"/>
    <ellipse cx="388" cy="185" rx="122" ry="88" fill="#f5edda" fill-opacity=".65" stroke="#775e32" stroke-width="2"/>
    <text x="223" y="132" font-size="25" fill="#304974">2ℤ</text>
    <text x="417" y="132" font-size="25" fill="#775e32">3ℤ</text>
    <text x="320" y="175" font-size="25">6ℤ</text>
    <text x="200" y="196" font-size="23">2, 4, …</text>
    <text x="440" y="196" font-size="23">3, 9, …</text>
    <text x="320" y="211" font-size="20">6, 12, …</text>
    <text x="320" y="290" font-size="21">1, 5, 7, …</text>
    <text x="320" y="343" font-size="24">2ℤ ∩ 3ℤ = 6ℤ</text>
  </g>
</svg>
